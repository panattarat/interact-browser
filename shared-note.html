<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Shared Note</title>
  <link rel="stylesheet" href="css/common.css">
  <style>
    body { display: flex; flex-direction: column; }
    .bar {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      padding: 16px 16px 12px 140px;
      font-size: 14px;
    }
    .bar .room { font-weight: 600; }
    .bar .status { color: var(--muted); margin-right: auto; }
    .bar .status.online::before { content: "● "; color: #4ade80; }
    .bar .status.offline::before { content: "● "; color: #f87171; }
    textarea {
      flex: 1;
      margin: 0 16px calc(16px + env(safe-area-inset-bottom));
      padding: 16px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: var(--radius);
      background: var(--card);
      color: var(--fg);
      font: inherit;
      font-size: 16px; /* ต่ำกว่า 16px iOS จะซูมตอนแตะ */
      line-height: 1.6;
      resize: none;
      outline: none;
    }
    textarea:focus { border-color: var(--accent); }
    textarea:disabled { opacity: 0.5; }
    @media (max-width: 600px) {
      .bar { padding: calc(12px + env(safe-area-inset-top)) 8px 8px 120px; }
      textarea { margin: 0 8px calc(8px + env(safe-area-inset-bottom)); }
    }
  </style>
</head>
<body>
  <div class="bar">
    <span>📝 ห้อง <span class="room" id="room"></span></span>
    <span class="status offline" id="status">กำลังเชื่อมต่อ…</span>
    <button class="chip" id="change-room">🔀 เปลี่ยนห้อง</button>
    <button class="chip" id="copy-link">🔗 คัดลอกลิงก์</button>
  </div>
  <textarea id="note" placeholder="พิมพ์อะไรก็ได้ ทุกคนที่เปิดลิงก์นี้จะเห็นและแก้ได้ทันที" spellcheck="false" disabled></textarea>

  <script src="js/common.js"></script>
  <script src="js/shared-note.js"></script>
</body>
</html>
